services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env # ensures the API_KEY safety
    volumes:
      - ./backend:/app # Hot-reloading: changes in the code update the container instantly

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend # Ensures the backend starts before the frontend